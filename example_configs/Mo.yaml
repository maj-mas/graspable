# information about the computing environment
env:
  grasp_bin_path: /home/majam/code/grasp/bin # path to grasp binaries
  working_dir: /home/majam/code/graspable_data/Mo/work # path for intermediate but not temporary files
  output_dir: /home/majam/code/graspable_data/Mo # path to save important result files to, e.g. a path in the home directory. if null, no action is taken.
  result_filetypes: [".cm", ".m", ".lsj", ".ct"] # types of result files that should be moved to output_dir for savekeeping
  mpi:
    use: true # whether to use mpi
    n_p: 12 # number of mpi tasks. must be specified so the folders in tmp_dir and the disks file can be set up
    invoke_cmd: "mpirun -np 12" # mpi invocation, e.g. mpirun -np 12 or srun
    tmp_dir: /home/majam/code/graspable_data/Mo/tmp_mpi # path for mpi tmp files, creates 1 dir per task there
    mem: true # whether to use rmcdhf_mem_mpi, I think yes is a good default
  clean: false

# metadata, no impact on calculations
meta:
  name: "calculation" # name of calculation, only used for output

# nuclear data
nuclear:
  Z: 42 # atomic number
  A: 96 # mass number,
  point-like: false # whether to use point-like nuclear potential. same effect achieved by A = 0
  m: 96 # NEUTRAL atomic mass in amu
  static: false # whether the nucleus is to be taken as static. same effect achieved by m = 0
  I: 0 # nuclear spin in hbar
  dipole: 0 # nuclear dipole moment in nuclear magnetons
  quadrupole: 0 # nuclear quadrupole moment in barn

# data for csf expansion generation
states:
  multireference:
    even: ["1s2 2s1 2p2"] # list of even reference states
    odd: ["1s2 2s2 2p1", "1s2 2p3"] # list of odd reference states
  core: null
  basis_set: "3s,3p,3d" # string defining the basis expansion in the form "5s,4p,3d"
  active: "*" # space delimited list of active shells (wildcards allowed) or object specifying minimum occupation for every shell
  excitations: 2 # integer value specifiyng the maximum number of excitations to generate csfs from the multireference with. GRASP's semantics apply wrt. to negative values
  split: true # whether to split as for convergence check TODO maybe this should be removed and just be true
  reduce: false # whether to attempt to reduce the active space using rcsfinteract
  2j_min: 1 # minimum value of 2J for generated CSFs
  2j_max: 5 # maximum value of 2J for generated CSFs

# parameters for the determination of initial wavefunctions in the multireference
# TODO debug options
orbital_init:
  type: "screened_h" # "tf", "screened_h", "screened_h_z"


# parameters for the initial scf procedure on the states in the multireference
# TODO debug options, level weigths
mr_csf:
  optimization_order: "default" # comma delimited string of relativistic subshells, wildcards allowed, or one of the following: "default", "adaptive" (see docs)
  levels_per_j: 1 # if int, applies to all J in range, otherwise list of number of states

# parameters for the scf procedure for the active space
# TODO debug options, level weigths
as_csf:
  optimization_order: "default" # comma delimited string of relativistic subshells, wildcards allowed, or one of the following: "default", "adaptive" (see docs)
  levels_per_j: 1 # if int, applies to all J in range, otherwise list of number of states

# parameters for the ci calculation
# TODO debug options
ci:
  as_expansion: true # whether to perform CI at every step as the active space is expanded by +1 in the principal quantum number. useful to estimate convergence of levels
  qed:
    with_and_without: false # useful to explicitly state the contribution of qed. if true, rci is run once with and once without QED
    transverse: false
    transverse_all_freqs: false
    scale: "1.d-6"
    vacpol: false
    normal_ms: false # normal mass shift
    specific_ms: false # specific mass shift
    se: false # self-energy
    n_se: false # maximum n quantum number for self-energy estimation

# parameters for transition matrix element calculation
trans:
  multipoles: ["E1",] # list of multipole types, e.g. ["E1", "M2"]
  eveneven: true # perform calculation for transitions among the even multireference
  oddodd: true # perform calculation for transitions among the odd multireference
  evenodd: true # perform calculation for transitions between odd and even states in the respective multireference
